services:
  web:
    build: .
    image: apinil-web:local
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
  auth:
    build: ./auth
    image: apinil-auth:local
    network_mode: host
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
