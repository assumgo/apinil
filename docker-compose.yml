services:
  web:
    build: .
    image: apinil-web:local
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    image: apinil-auth:local
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      BACKUP_DIR: /var/lib/apinil/backups
    volumes:
      - /opt/apinil/backups:/var/lib/apinil/backups
    restart: unless-stopped
