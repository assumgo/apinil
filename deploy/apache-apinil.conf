# Exige os módulos ssl, rewrite, headers, proxy e proxy_http.
# A porta 80 só redireciona. O site e a área restrita respondem em HTTPS.
# Coloque o certificado em /etc/ssl/apinil/fullchain.pem e a chave em privkey.pem.

<VirtualHost *:80>
    ServerName apinil.local
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/apinil-error.log
    CustomLog ${APACHE_LOG_DIR}/apinil-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName apinil.local
    SSLEngine on
    SSLCertificateFile /etc/ssl/apinil/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/apinil/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "frame-ancestors 'none'"
    Header always set Referrer-Policy "same-origin"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    ProxyPass /restrito/ http://127.0.0.1:8090/restrito/
    ProxyPassReverse /restrito/ http://127.0.0.1:8090/restrito/

    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/apinil-error.log
    CustomLog ${APACHE_LOG_DIR}/apinil-access.log combined
</VirtualHost>
