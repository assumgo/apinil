# A porta 80 só redireciona e deixa passar o desafio do certificado.
# O certificado em uso fica em /etc/letsencrypt/live/104.161.32.245/.

<VirtualHost *:80>
    ServerName 104.161.32.245

    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme/.well-known/acme-challenge/>
        Require all granted
        Options -Indexes
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://104.161.32.245%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/apinil-error.log
    CustomLog ${APACHE_LOG_DIR}/apinil-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName 104.161.32.245
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/104.161.32.245/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/104.161.32.245/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "frame-ancestors 'none'"
    Header always set Referrer-Policy "same-origin"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    ProxyPass /restrito/ http://127.0.0.1:8090/restrito/
    ProxyPassReverse /restrito/ http://127.0.0.1:8090/restrito/

    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/apinil-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/apinil-ssl-access.log combined
</VirtualHost>
